<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Mode 2: PKCS#11 dispatch to threshold</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">Existing PKCS#11 apps work unchanged with threshold backing</text>

  <!-- Existing app -->
  <rect x="50" y="80" width="200" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">Existing app</text>
  <text x="150" y="123" text-anchor="middle" font-size="10">OpenSSL / OpenSSH / nginx /</text>
  <text x="150" y="138" text-anchor="middle" font-size="10">Java KeyStore / Apache / etc.</text>
  <text x="150" y="153" text-anchor="middle" font-size="9" fill="#666">unchanged code</text>

  <!-- Standard PKCS#11 interface -->
  <rect x="290" y="80" width="220" height="80" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">PKCS#11 v3.0 API</text>
  <text x="400" y="123" text-anchor="middle" font-size="10">C_Sign(), C_Decrypt(),</text>
  <text x="400" y="138" text-anchor="middle" font-size="10">C_GenerateKeyPair(), ...</text>
  <text x="400" y="153" text-anchor="middle" font-size="9" fill="#666">OASIS standard interface</text>

  <!-- Confium PKCS#11 server -->
  <rect x="550" y="80" width="200" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="650" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">confium-pkcs11-server</text>
  <text x="650" y="123" text-anchor="middle" font-size="10">dispatch layer</text>
  <text x="650" y="138" text-anchor="middle" font-size="10">SlotId → QuorumId</text>
  <text x="650" y="153" text-anchor="middle" font-size="9" fill="#666">cdylib loaded as PKCS#11 module</text>

  <!-- Arrows -->
  <line x1="250" y1="120" x2="290" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="510" y1="120" x2="550" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Coordinator + threshold quorum -->
  <rect x="50" y="220" width="700" height="200" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Threshold dispatch</text>

  <!-- Coordinator -->
  <rect x="320" y="265" width="160" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Coordinator</text>
  <text x="400" y="307" text-anchor="middle" font-size="10">async session state machine</text>

  <!-- Signers -->
  <rect x="80" y="350" width="100" height="50" rx="6" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="372" text-anchor="middle" font-size="11">Signer 1</text>
  <text x="130" y="387" text-anchor="middle" font-size="9" fill="#666">YubiKey-held share</text>

  <rect x="200" y="350" width="100" height="50" rx="6" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="250" y="372" text-anchor="middle" font-size="11">Signer 2</text>
  <text x="250" y="387" text-anchor="middle" font-size="9" fill="#666">HSM-held share</text>

  <rect x="320" y="350" width="100" height="50" rx="6" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="372" text-anchor="middle" font-size="11">Signer 3</text>
  <text x="370" y="387" text-anchor="middle" font-size="9" fill="#666">TPM-held share</text>

  <rect x="440" y="350" width="100" height="50" rx="6" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="372" text-anchor="middle" font-size="11">Signer 4</text>
  <text x="490" y="387" text-anchor="middle" font-size="9" fill="#666">cloud KMS share</text>

  <rect x="560" y="350" width="100" height="50" rx="6" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="372" text-anchor="middle" font-size="11">Signer 5</text>
  <text x="610" y="387" text-anchor="middle" font-size="9" fill="#666">OpenPGP card share</text>

  <!-- Arrows -->
  <line x1="650" y1="160" x2="650" y2="220" stroke="#999" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="660" y="190" font-size="10" fill="#666">dispatch via QuorumDispatcher trait</text>

  <line x1="400" y1="325" x2="400" y2="345" stroke="#999" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="410" y="340" font-size="9" fill="#666">T-of-N async threshold protocol</text>

  <line x1="350" y1="325" x2="130" y2="350" stroke="#999" stroke-width="1"/>
  <line x1="370" y1="325" x2="250" y2="350" stroke="#999" stroke-width="1"/>
  <line x1="400" y1="325" x2="370" y2="350" stroke="#999" stroke-width="1"/>
  <line x1="430" y1="325" x2="490" y2="350" stroke="#999" stroke-width="1"/>
  <line x1="450" y1="325" x2="610" y2="350" stroke="#999" stroke-width="1"/>

  <text x="400" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Result: app sees normal PKCS#11; signature actually produced by T-of-N threshold</text>
  <text x="400" y="468" text-anchor="middle" font-size="10" fill="#888">TODO.roadmap/28-mode2-pki-replacement.md — Mode 2 cornerstone</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
