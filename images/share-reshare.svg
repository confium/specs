<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Share re-sharing preserves public key</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">Committee evolution without re-issuance cascade</text>

  <!-- Old committee -->
  <rect x="60" y="80" width="220" height="240" rx="8" fill="#fef3e7" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">Old committee</text>
  <text x="170" y="125" text-anchor="middle" font-size="11">3-of-5 (T=3, N=5)</text>
  <g font-size="10" fill="#333">
    <circle cx="100" cy="155" r="14" fill="#fef3e7" stroke="#d97706"/>
    <text x="100" y="160" text-anchor="middle" font-size="9">A</text>
    <circle cx="140" cy="155" r="14" fill="#fef3e7" stroke="#d97706"/>
    <text x="140" y="160" text-anchor="middle" font-size="9">B</text>
    <circle cx="180" cy="155" r="14" fill="#fef3e7" stroke="#d97706"/>
    <text x="180" y="160" text-anchor="middle" font-size="9">C</text>
    <circle cx="220" cy="155" r="14" fill="#fef3e7" stroke="#d97706"/>
    <text x="220" y="160" text-anchor="middle" font-size="9">D</text>
    <circle cx="260" cy="155" r="14" fill="#fef3e7" stroke="#d97706"/>
    <text x="260" y="160" text-anchor="middle" font-size="9">E</text>
  </g>
  <text x="170" y="200" text-anchor="middle" font-size="11">Alice departing</text>
  <text x="170" y="220" text-anchor="middle" font-size="10" fill="#666">(share revoked)</text>
  <text x="170" y="250" text-anchor="middle" font-size="10" fill="#666">Lagrange interp:</text>
  <text x="170" y="266" text-anchor="middle" font-size="10" fill="#666">s_j' = Σ s_i · λ_j(i)</text>
  <text x="170" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">T = 3 must participate</text>
  <text x="170" y="310" text-anchor="middle" font-size="10" fill="#666">(e.g. B, C, D)</text>

  <!-- Arrow -->
  <line x1="290" y1="200" x2="390" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="340" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">re-share</text>
  <text x="340" y="220" text-anchor="middle" font-size="9" fill="#666">protocol</text>

  <!-- New committee -->
  <rect x="400" y="80" width="220" height="240" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="510" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">New committee</text>
  <text x="510" y="125" text-anchor="middle" font-size="11">3-of-5 (T=3, N=5)</text>
  <g font-size="10" fill="#333">
    <circle cx="440" cy="155" r="14" fill="#dcfce7" stroke="#15803d"/>
    <text x="440" y="160" text-anchor="middle" font-size="9">B</text>
    <circle cx="480" cy="155" r="14" fill="#dcfce7" stroke="#15803d"/>
    <text x="480" y="160" text-anchor="middle" font-size="9">C</text>
    <circle cx="520" cy="155" r="14" fill="#dcfce7" stroke="#15803d"/>
    <text x="520" y="160" text-anchor="middle" font-size="9">D</text>
    <circle cx="560" cy="155" r="14" fill="#dcfce7" stroke="#15803d"/>
    <text x="560" y="160" text-anchor="middle" font-size="9">E</text>
    <circle cx="600" cy="155" r="14" fill="#dcfce7" stroke="#15803d"/>
    <text x="600" y="160" text-anchor="middle" font-size="9">F</text>
  </g>
  <text x="510" y="200" text-anchor="middle" font-size="11">Frank joining</text>
  <text x="510" y="220" text-anchor="middle" font-size="10" fill="#666">(new share issued)</text>
  <text x="510" y="250" text-anchor="middle" font-size="10" fill="#666">Old shares destroyed</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#666">(zeroized)</text>
  <text x="510" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Test signature validates</text>
  <text x="510" y="310" text-anchor="middle" font-size="10" fill="#666">under SAME public key</text>

  <!-- Public key invariant -->
  <rect x="100" y="360" width="600" height="50" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="400" y="383" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">Public key P = x · G (UNCHANGED)</text>
  <text x="400" y="400" text-anchor="middle" font-size="10" fill="#666">All dependent certs (IA, CNML, instance certs) remain valid — no re-issuance cascade</text>

  <text x="400" y="445" text-anchor="middle" font-size="10" fill="#888">TODO.roadmap/30-tc-reshare-protocol.md</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
