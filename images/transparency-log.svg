<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Helvetica, Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Transparency log + Bitcoin OTS anchoring</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">RFC 6962 Merkle tree with periodic OpenTimestamps anchors</text>

  <!-- Append-only entries -->
  <rect x="50" y="80" width="200" height="220" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Append-only entries</text>
  <g font-size="10" fill="#333">
    <text x="60" y="135">seq=0  cert:IA-France-issued</text>
    <text x="60" y="155">seq=1  cert:TL-PTB-accredited</text>
    <text x="60" y="175">seq=2  sig:FROST-5-of-7</text>
    <text x="60" y="195">seq=3  cert:Mfr-Model-FM-A</text>
    <text x="60" y="215">seq=4  cert:Instance-SN0001</text>
    <text x="60" y="235">seq=5  rev:TL-NIST-revoked</text>
    <text x="60" y="255">seq=6  reshare:biml-root</text>
    <text x="60" y="275">seq=7  ...</text>
  </g>

  <!-- Merkle tree -->
  <g transform="translate(280, 80)">
    <text x="220" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">Merkle tree (RFC 6962)</text>
    
    <!-- Root -->
    <rect x="190" y="40" width="60" height="32" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="220" y="60" text-anchor="middle" font-size="11">root</text>

    <!-- Mid level -->
    <rect x="100" y="100" width="60" height="32" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="130" y="120" text-anchor="middle" font-size="10">h_01</text>
    <rect x="280" y="100" width="60" height="32" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="310" y="120" text-anchor="middle" font-size="10">h_23</text>

    <!-- Leaf level -->
    <rect x="40" y="160" width="60" height="32" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="70" y="180" text-anchor="middle" font-size="10">L_0</text>
    <rect x="160" y="160" width="60" height="32" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="190" y="180" text-anchor="middle" font-size="10">L_1</text>
    <rect x="240" y="160" width="60" height="32" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="270" y="180" text-anchor="middle" font-size="10">L_2</text>
    <rect x="360" y="160" width="60" height="32" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
    <text x="390" y="180" text-anchor="middle" font-size="10">L_3</text>

    <!-- Lines -->
    <line x1="130" y1="132" x2="200" y2="72" stroke="#999" stroke-width="1"/>
    <line x1="310" y1="132" x2="240" y2="72" stroke="#999" stroke-width="1"/>
    <line x1="70" y1="192" x2="130" y2="132" stroke="#999" stroke-width="1"/>
    <line x1="190" y1="192" x2="130" y2="132" stroke="#999" stroke-width="1"/>
    <line x1="270" y1="192" x2="310" y2="132" stroke="#999" stroke-width="1"/>
    <line x1="390" y1="192" x2="310" y2="132" stroke="#999" stroke-width="1"/>

    <!-- Tag -->
    <text x="220" y="220" text-anchor="middle" font-size="10" fill="#666">SHA-256 leaf = 0x01 ‖ entry_hash</text>
    <text x="220" y="236" text-anchor="middle" font-size="10" fill="#666">SHA-256 internal = 0x02 ‖ L ‖ R</text>
  </g>

  <!-- OTS anchor -->
  <rect x="50" y="320" width="700" height="80" rx="8" fill="#fef3e7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">OpenTimestamps anchor (every N entries or every hour)</text>
  <text x="400" y="365" text-anchor="middle" font-size="11">tree root → public calendar servers → Bitcoin blockchain</text>
  <text x="400" y="383" text-anchor="middle" font-size="10" fill="#666">Verifier: inclusion proof + OTS proof → "this artifact was in the tree as of block N"</text>

  <!-- Arrow from tree to OTS -->
  <line x1="500" y1="270" x2="500" y2="315" stroke="#666" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Bitcoin -->
  <rect x="280" y="420" width="240" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="400" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Bitcoin blockchain</text>
  <text x="400" y="460" text-anchor="middle" font-size="10" fill="#666">immutable timestamp anchor</text>

  <!-- Arrow -->
  <line x1="400" y1="400" x2="400" y2="415" stroke="#666" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Properties -->
  <text x="400" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Properties: time-of-existence + inclusion + public log = catches compelled issuance</text>
  <text x="400" y="525" text-anchor="middle" font-size="10" fill="#888">TODO.roadmap/36-transparency-and-ots.md</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
