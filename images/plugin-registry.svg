<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Plugin registry — OCP via link-time registration</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">New interfaces = new module calling register_interface!. Zero edits to existing code.</text>

  <!-- Core engine -->
  <rect x="100" y="80" width="600" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">confium-core engine</text>
  <text x="400" y="123" text-anchor="middle" font-size="10">plugin loader · FFI · registry</text>

  <!-- Inventory link-time -->
  <rect x="100" y="160" width="600" height="200" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6"/>
  <text x="400" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">inventory crate (link-time registration via #[ctor])</text>

  <!-- Shipped interfaces -->
  <g font-size="11">
    <rect x="120" y="200" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="180" y="223" text-anchor="middle">hash</text>
    <rect x="260" y="200" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="320" y="223" text-anchor="middle">rng</text>
    <rect x="400" y="200" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="460" y="223" text-anchor="middle">cipher</text>
    <rect x="540" y="200" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="600" y="223" text-anchor="middle">aead</text>

    <rect x="120" y="250" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="180" y="273" text-anchor="middle">kdf</text>
    <rect x="260" y="250" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="320" y="273" text-anchor="middle">kem</text>
    <rect x="400" y="250" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="460" y="273" text-anchor="middle">keyfmt</text>
    <rect x="540" y="250" width="120" height="40" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="600" y="273" text-anchor="middle">signature</text>

    <rect x="260" y="300" width="280" height="40" rx="4" fill="#fef9c3" stroke="#a16207"/>
    <text x="400" y="323" text-anchor="middle">+ future interfaces added without touching existing</text>
  </g>

  <!-- Plugin authors -->
  <rect x="100" y="380" width="280" height="60" rx="8" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Plugin author</text>
  <text x="240" y="423" text-anchor="middle" font-size="10">registers via register_interface!(Kind)</text>

  <!-- Engine consumer -->
  <rect x="420" y="380" width="280" height="60" rx="8" fill="#fef3e7" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Engine consumer</text>
  <text x="560" y="423" text-anchor="middle" font-size="10">downcasts via interface_of(plugin)</text>

  <!-- Arrows -->
  <line x1="240" y1="380" x2="240" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <line x1="560" y1="380" x2="560" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#888">TODO.roadmap/43-plugin-author-guide.md · confium-core/src/interfaces/</text>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
