# Contract checks for the central-site rendering pipeline.
#
# The site (confium/confium.github.io) renders every spec here
# through its AsciiDoc converter, under quality gates (neutrality,
# forbidden language, spec completeness). Those checks used to run
# only in the site repo — one repository and one deploy cycle away
# from the edit that broke them. This workflow enforces the same
# contract here, on every PR, using the site's own modules:
#
#  1. AsciiDoc syntax: every source must render clean under
#     Asciidoctor at WARN strictness (the site converter is
#     deliberately lenient; this is the strict reader's opinion).
#  2. Internal link integrity: every relative link:/image:: target
#     in README and the corpus must exist — renumberings caught at
#     the source, not as dead ends for readers.
#  3. Converter contract: the site's unit tests + golden-corpus
#     test run against THIS PR's corpus (placed where the site's
#     fetch pipeline expects it, so fetch-sources reuses it).

name: contract

on:
  pull_request:
    paths:
      - "specs/**"
      - "images/**"
      - ".github/workflows/contract.yml"
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "images/**"
      - ".github/workflows/contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: confium/confium
          path: confium
          sparse-checkout: crates
      - name: Spec 02 crate list must match the workspace
        run: |
          spec=$(grep -oE '`confium-[a-z0-9-]+`' specs/02-workspace-organization.adoc | tr -d '\`' | grep -v 'confium-ruby' | sort -u)
          real=$(find confium/crates -maxdepth 2 -name Cargo.toml | xargs grep -h '^name = "confium-' | sed 's/name = "//;s/"//' | sort -u)
          diff <(echo "$spec") <(echo "$real") || {
            echo "ERROR: spec 02 crate list diverged from the workspace (see diff above)."
            exit 1
          }

  asciidoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Asciidoctor
        run: gem install asciidoctor --no-document

      - name: Render every source (fail on warnings)
        run: asciidoctor --failure-level WARN -q -D /tmp/rendered specs/*.adoc README.adoc report.adoc

      - name: Internal link integrity (relative targets must exist)
        run: |
          dead=0
          for f in README.adoc specs/*.adoc; do
            dir=$(dirname "$f")
            for target in $(grep -oE 'link:[^[]+' "$f" | sed 's/^link://;s/^++//;s/++$//'); do
              case "$target" in http*|mailto:*) continue;; esac
              [ -f "$dir/$target" ] || { echo "DEAD link in $f: $target"; dead=1; }
            done
            for target in $(grep -oE '^image::[^[]+' "$f" | sed 's/^image:://'); do
              [ -f "$dir/$target" ] || { echo "DEAD image in $f: $target"; dead=1; }
            done
          done
          exit $dead

  converter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: specs

      - uses: actions/checkout@v4
        with:
          repository: confium/confium.github.io
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Place this corpus where the fetch pipeline expects it
        run: |
          mkdir -p site/vendor
          cp -r specs site/vendor/specs

      - name: Convert and run the contract tests
        working-directory: site
        run: |
          node scripts/fetch-sources.mjs specs
          npx vitest run scripts
